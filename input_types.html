<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Input Types</title>
</head>
<body>

    <h1>HTML Input Types</h1>

    <form>

        <!-- 1. Text -->
        <label for="username">Text:</label>
        <input type="text" id="username" name="username">
        <br><br>

        <!-- 2. Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <!-- 3. Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <!-- 4. Number -->
        <label for="age">Number:</label>
        <input type="number" id="age" name="age">
        <br><br>

        <!-- 5. Tel -->
        <label for="phone">Telephone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <!-- 6. URL -->
        <label for="website">URL:</label>
        <input type="url" id="website" name="website">
        <br><br>

        <!-- 7. Search -->
        <label for="search">Search:</label>
        <input type="search" id="search" name="search">
        <br><br>

        <!-- 8. Date -->
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <!-- 9. Time -->
        <label for="time">Time:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <!-- 10. Date and Time -->
        <label for="datetime">Date and Time:</label>
        <input type="datetime-local" id="datetime" name="datetime">
        <br><br>

        <!-- 11. Month -->
        <label for="month">Month:</label>
        <input type="month" id="month" name="month">
        <br><br>

        <!-- 12. Week -->
        <label for="week">Week:</label>
        <input type="week" id="week" name="week">
        <br><br>

        <!-- 13. Color -->
        <label for="color">Color:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <!-- 14. Range -->
        <label for="range">Range:</label>
        <input type="range" id="range" name="range" min="0" max="100">
        <br><br>

        <!-- 15. Checkbox -->
        <label>Checkbox:</label>
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree</label>
        <br><br>

        <!-- 16. Radio -->
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <br><br>

        <!-- 17. File -->
        <label for="file">File:</label>
        <input type="file" id="file" name="file">
        <br><br>

        <!-- 18. Hidden -->
        <input type="hidden" name="user_id" value="101">

        <!-- 19. Image -->
        <label>Image Button:</label>
        <input
            type="image"
            src="https://via.placeholder.com/100x40"
            alt="Submit"
            width="100"
            height="40"
        >
        <br><br>

        <!-- 20. Submit -->
        <input type="submit" value="Submit">
        <br><br>

        <!-- 21. Reset -->
        <input type="reset" value="Reset">
        <br><br>

        <!-- 22. Button -->
        <input
            type="button"
            value="Click Me"
            onclick="alert('Button clicked!')"
        >

    </form>

</body>
</html>
