<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<body>

    <h1>Forgot Password</h1>

    <br>

    <form action="password-success.html">

        <label for="fullname">
            Full Name:
        </label>

        <br>

        <input
            type="text"
            id="fullname"
            name="fullname"
            required
        >

        <br><br>


        <label for="email">
            Email:
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>


        <label for="phone">
            Phone Number:
        </label>

        <br>

        <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <br><br>


        <label for="dob">
            Date of Birth:
        </label>

        <br>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >

        <br><br>


        <label for="new-password">
            New Password:
        </label>

        <br>

        <input
            type="password"
            id="new-password"
            name="new-password"
            minlength="8"
            required
        >

        <br><br>


        <label for="confirm-password">
            Confirm Password:
        </label>

        <br>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            minlength="8"
            required
        >

        <br><br>


        <label for="security-question">
            Security Question:
        </label>

        <br>

        <select
            id="security-question"
            name="security-question"
            required
        >

            <option value="">
                Select Question
            </option>

            <option value="pet">
                What was your first pet's name?
            </option>

            <option value="school">
                What was your school name?
            </option>

            <option value="city">
                What city were you born in?
            </option>

        </select>

        <br><br>


        <label for="answer">
            Security Answer:
        </label>

        <br>

        <input
            type="text"
            id="answer"
            name="answer"
            required
        >

        <br><br>


        <input
            type="submit"
            value="Submit"
        >

        <input
            type="reset"
            value="Reset"
        >

    </form>

    <br>

    <a href="index.html">
        Back to Login
    </a>

</body>

</html>
