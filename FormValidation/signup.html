<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>

<body>

    <h1>Signup</h1>

    <br>

    <form action="signup-success.html">

        <label for="fullname">
            Full Name:
        </label>

        <br>

        <input
            type="text"
            id="fullname"
            name="fullname"
            required
        >

        <br><br>


        <label for="username">
            Username:
        </label>

        <br>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>


        <label for="email">
            Email:
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>


        <label for="phone">
            Phone Number:
        </label>

        <br>

        <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <br><br>


        <label for="password">
            Password:
        </label>

        <br>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >

        <br><br>


        <label for="confirm-password">
            Confirm Password:
        </label>

        <br>

        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            minlength="8"
            required
        >

        <br><br>


        <label for="dob">
            Date of Birth:
        </label>

        <br>

        <input
            type="date"
            id="dob"
            name="dob"
            required
        >

        <br><br>


        <label>
            Gender:
        </label>

        <br>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
        >

        <label for="male">
            Male
        </label>

        <br>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >

        <label for="female">
            Female
        </label>

        <br>

        <input
            type="radio"
            id="other"
            name="gender"
            value="other"
        >

        <label for="other">
            Other
        </label>

        <br><br>


        <label for="country">
            Country:
        </label>

        <br>

        <select id="country" name="country" required>

            <option value="">
                Select Country
            </option>

            <option value="india">
                India
            </option>

            <option value="usa">
                USA
            </option>

            <option value="uk">
                UK
            </option>

        </select>

        <br><br>


        <label for="address">
            Address:
        </label>

        <br>

        <textarea
            id="address"
            name="address"
            rows="4"
            cols="25"
            required
        ></textarea>

        <br><br>


        <input
            type="checkbox"
            id="terms"
            name="terms"
            required
        >

        <label for="terms">
            I agree to Terms and Conditions
        </label>

        <br><br>


        <input
            type="submit"
            value="Sign Up"
        >

        <input
            type="reset"
            value="Reset"
        >

    </form>

    <br>

    <a href="index.html">
        Back to Login
    </a>

</body>

</html>
