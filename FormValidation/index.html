<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <br>

    <form action="login-success.html">

        <label for="username">
            Username:
        </label>

        <br>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>


        <label for="password">
            Password:
        </label>

        <br>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >

        <br><br>


        <input
            type="submit"
            value="Login"
        >

    </form>

    <br>


    <form action="signup.html">

        <input
            type="submit"
            value="Sign Up"
        >

    </form>

    <br>


    <a href="forgot-password.html">
        Forgot Password?
    </a>

</body>

</html>
