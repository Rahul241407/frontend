<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
</head>

<body>

  <form action="./submitted.html">

    <label for="username">UserName</label>
    <br>

    <input 
      type="text"
      id="username"
      pattern="[a-z0-9]+@(yahoo|gmail)\.(com|at|org|in|gov|co)"
      required
    >

    <br><br>

    <label for="password">Password</label>
    <br>

    <input 
      type="password"
      id="password"
      pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,16}"
      required
    >

    <br><br>

    <input type="submit">

  </form>

</body>
</html>
